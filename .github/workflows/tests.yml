name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Python; no longer built for Ubuntu 26.04.
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          # Stock macOS bash is 3.2; run the scripts with it, not a newer Homebrew bash.
          - os: macos-latest
            python: "3.13"
            bash: /bin/bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        env:
          TEST_BASH: ${{ matrix.bash || 'bash' }}
        run: python -m unittest discover -s tests -v
